<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стартовая</title>
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body>
  <!-- Top bar: full-width flex, gear pinned to right edge -->
  <header class="topbar">
    <div class="topbar__search">
      <div class="filter-wrap">
        <input type="text" id="filterInput" class="filter-wrap__input" placeholder="Поиск по закладкам…">
        <button class="filter-wrap__clear" id="filterClear" hidden title="Очистить">✕</button>
      </div>
      <label class="topbar__checkbox">
        <input type="checkbox" id="filterCurrentTab"> только в текущем табе
      </label>
    </div>
    <button class="topbar__gear" id="gearBtn" title="Настройки"><span>⚙️</span></button>
  </header>

  <!-- Tabs strip -->
  <nav class="tabs-strip" id="tabsStrip"></nav>

  <!-- Main content area -->
  <main class="content" id="contentArea">
    <div class="content__empty" id="emptyState">
      <p>Папка не выбрана.</p>
      <button id="openSettings">Открыть настройки</button>
    </div>
  </main>

  <!-- Bottom bar: open in new tab -->
  <footer class="bottom-bar">
    <label class="bottom-bar__toggle">
      <input type="checkbox" id="openInNewTab" checked>
      <span>Открывать URL в новой вкладке</span>
    </label>
  </footer>

  <!-- Context menu -->
  <div class="ctx-menu" id="ctxMenu" hidden></div>

  <!-- Modal dialog for editing bookmarks -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title" id="modalTitle"></span>
        <button class="modal__close" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__footer">
        <button class="modal__btn modal__btn--cancel" id="modalCancelBtn">Отмена</button>
        <button class="modal__btn modal__btn--save" id="modalSaveBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/configstore.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/render.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/contextmenu.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
