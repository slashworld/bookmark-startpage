<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стартовая</title>
  <link rel="stylesheet" href="css/newtab.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <!-- Top bar: full-width flex, gear pinned to right edge -->
  <header class="topbar">
    <div class="topbar__search">
      <div class="filter-wrap">
        <input type="text" id="filterInput" class="filter-wrap__input" data-i18n-placeholder="search.placeholder" placeholder="Поиск по закладкам…">
        <button class="filter-wrap__clear" id="filterClear" hidden data-i18n-title="search.clear" title="Очистить">✕</button>
      </div>
      <label class="topbar__checkbox">
        <input type="checkbox" id="filterCurrentTab">
        <span data-i18n="search.currentTabOnly">только в текущем табе</span>
      </label>
    </div>
    <div class="topbar__theme-toggle" id="themeToggle" role="group" aria-label="Theme">
      <button type="button" class="theme-btn" data-theme-val="auto" data-i18n-title="theme.auto" title="Как на устройстве">💻</button>
      <button type="button" class="theme-btn" data-theme-val="light" data-i18n-title="theme.light" title="Светлая">☀️</button>
      <button type="button" class="theme-btn" data-theme-val="dark" data-i18n-title="theme.dark" title="Тёмная">🌙</button>
    </div>
    <button class="topbar__gear" id="gearBtn" data-i18n-title="settings.title" title="Настройки"><span>⚙️</span></button>
  </header>

  <!-- Tabs strip -->
  <nav class="tabs-strip" id="tabsStrip"></nav>

  <!-- Main content area -->
  <main class="content" id="contentArea">
    <div class="content__empty" id="emptyState">
      <p data-i18n="newtab.emptyState">Папка не выбрана.</p>
      <button id="openSettings" data-i18n="newtab.openSettings">Открыть настройки</button>
    </div>
  </main>

  <!-- Bottom bar: open in new tab & view settings -->
  <footer class="bottom-bar">
    <label class="bottom-bar__toggle">
      <input type="checkbox" id="openInNewTab" checked>
      <span data-i18n="settings.openInNewTab">Открывать URL в новой вкладке</span>
    </label>
  </footer>

  <div class="view-settings-float" id="viewSettingsWrap">
      <button type="button" class="view-settings-float__btn bottom-bar__view-btn" id="viewSettingsBtn" data-i18n-title="viewSettings.title" title="Настройка вида">
        <span>🎨</span>
        <span data-i18n="viewSettings.button">Вид</span>
      </button>
      <div class="view-popover" id="viewSettingsPopover" hidden>
        <div class="view-popover__title">
          <span>🎨</span>
          <span data-i18n="viewSettings.title">Настройка вида карточек</span>
        </div>
        
        <!-- Icon size -->
        <div class="view-popover__row">
          <div class="view-popover__label-header">
            <span data-i18n="viewSettings.iconSize">Размер иконки</span>
            <span class="view-popover__size-val" id="popoverIconSizeVal">48×48</span>
          </div>
          <div class="view-popover__slider-wrap">
            <input type="range" class="view-popover__slider" id="popoverIconSize" min="16" max="256" step="8" list="icon-size-presets" value="48">
            <datalist id="icon-size-presets">
              <option value="16"></option>
              <option value="32"></option>
              <option value="48"></option>
              <option value="64"></option>
              <option value="128"></option>
              <option value="256"></option>
            </datalist>
          </div>
          <div class="view-popover__presets" id="popoverPresets">
            <button type="button" class="view-popover__preset-btn" data-size="16">16</button>
            <button type="button" class="view-popover__preset-btn" data-size="32">32</button>
            <button type="button" class="view-popover__preset-btn active" data-size="48">48</button>
            <button type="button" class="view-popover__preset-btn" data-size="64">64</button>
            <button type="button" class="view-popover__preset-btn" data-size="128">128</button>
            <button type="button" class="view-popover__preset-btn" data-size="256">256</button>
          </div>
        </div>

        <!-- Label position -->
        <div class="view-popover__row">
          <div class="view-popover__label-header">
            <span data-i18n="viewSettings.labelPosition">Расположение подписи</span>
          </div>
          <div class="view-popover__pos-group" id="popoverPosGroup">
            <button type="button" class="view-popover__pos-btn" data-pos="top">
              <span>⬆️</span>
              <span data-i18n="viewSettings.posTop">Сверху</span>
            </button>
            <button type="button" class="view-popover__pos-btn" data-pos="bottom">
              <span>⬇️</span>
              <span data-i18n="viewSettings.posBottom">Снизу</span>
            </button>
            <button type="button" class="view-popover__pos-btn" data-pos="left">
              <span>⬅️</span>
              <span data-i18n="viewSettings.posLeft">Слева</span>
            </button>
            <button type="button" class="view-popover__pos-btn active" data-pos="right">
              <span>➡️</span>
              <span data-i18n="viewSettings.posRight">Справа</span>
            </button>
          </div>
        </div>

        <!-- Title and URL toggles -->
        <div class="view-popover__row">
          <div class="view-popover__label-header">
            <span data-i18n="viewSettings.elements">Элементы подписи</span>
          </div>
          <div class="view-popover__checkboxes">
            <label class="view-popover__checkbox-label">
              <input type="checkbox" id="popoverShowTitle" checked>
              <span data-i18n="viewSettings.showTitle">Заголовок</span>
            </label>
            <label class="view-popover__checkbox-label">
              <input type="checkbox" id="popoverShowUrl" checked>
              <span data-i18n="viewSettings.showUrl">URL</span>
            </label>
          </div>
        </div>
      </div>
    </div>

  <!-- Context menu -->
  <div class="ctx-menu" id="ctxMenu" hidden></div>

  <!-- Modal dialog for editing bookmarks -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title" id="modalTitle"></span>
        <button class="modal__close" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__footer">
        <button class="modal__btn modal__btn--cancel" id="modalCancelBtn" data-i18n="common.cancel">Отмена</button>
        <button class="modal__btn modal__btn--save" id="modalSaveBtn" data-i18n="common.save">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/configstore.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/selection.js"></script>
  <script src="js/render.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/contextmenu.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
